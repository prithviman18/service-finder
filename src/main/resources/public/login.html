<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration - Local Service Finder</title>
    <meta name="description" content="Sign in to Local Service Finder to discover skilled local professionals or manage your service profile.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <!-- Logo & Header -->
        <div class="auth-header">
            <div class="logo-badge">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
            <h2>Service Finder</h2>
            <p>Connect with trusted local service professionals</p>
        </div>

        <!-- Quick Demo Accounts -->
        <div class="seed-accounts-box">
            <div class="seed-title">
                <i class="fa-solid fa-bolt"></i> Quick Demo Logins
            </div>
            <div class="seed-buttons">
                <button type="button" class="btn-seed" onclick="fillAndLogin('admin', 'admin123')">
                    <i class="fa-solid fa-shield-halved"></i> Admin
                </button>
                <button type="button" class="btn-seed" onclick="fillAndLogin('worker1', 'worker123')">
                    <i class="fa-solid fa-helmet-safety"></i> Worker (Ravi)
                </button>
                <button type="button" class="btn-seed" onclick="fillAndLogin('user1', 'user123')">
                    <i class="fa-solid fa-user"></i> User (Anil)
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login-btn" onclick="switchAuthTab('login')">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
            <button class="auth-tab" id="tab-register-btn" onclick="switchAuthTab('register')">
                <i class="fa-solid fa-user-plus"></i> Register
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="login-username">Username <span class="required-star">*</span></label>
                <div class="input-container">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="login-username" class="form-input" placeholder="e.g. admin or worker1" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password <span class="required-star">*</span></label>
                <div class="input-container">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btn-submit-login" class="btn-primary" style="margin-top: 1.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i> <span>Sign In to Dashboard</span>
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">I want to register as: <span class="required-star">*</span></label>
                <div class="role-picker-grid">
                    <label class="role-radio-card selected" id="card-role-user" onclick="selectRegisterRole('USER')">
                        <input type="radio" name="reg-role" value="USER" checked>
                        <div class="role-radio-icon"><i class="fa-solid fa-user"></i></div>
                        <div class="role-radio-info">
                            <h4>Customer / User</h4>
                            <p>Find & hire services</p>
                        </div>
                    </label>

                    <label class="role-radio-card" id="card-role-worker" onclick="selectRegisterRole('WORKER')">
                        <input type="radio" name="reg-role" value="WORKER">
                        <div class="role-radio-icon"><i class="fa-solid fa-helmet-safety"></i></div>
                        <div class="role-radio-info">
                            <h4>Service Worker</h4>
                            <p>Provide skilled work</p>
                        </div>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-name">Full Name <span class="required-star">*</span></label>
                <div class="input-container">
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input type="text" id="reg-name" class="form-input" placeholder="e.g. Rajesh Sharma" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-phone">Phone Number (10 digits) <span class="required-star">*</span></label>
                <div class="input-container">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="reg-phone" class="form-input" placeholder="e.g. 9876543210" pattern="\d{10}" maxlength="10" required>
                </div>
                <div class="form-helper">10-digit mobile number</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-username">Username <span class="required-star">*</span></label>
                <div class="input-container">
                    <i class="fa-solid fa-at input-icon"></i>
                    <input type="text" id="reg-username" class="form-input" placeholder="e.g. rajesh_worker" minlength="3" maxlength="20" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-password">Password <span class="required-star">*</span></label>
                <div class="input-container">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="reg-password" class="form-input" placeholder="Create a password (min 4 chars)" minlength="4" required>
                </div>
            </div>

            <!-- WORKER-ONLY FIELDS -->
            <div id="worker-extra-fields" style="display: none; border-top: 1px dashed var(--border-color); padding-top: 1.25rem; margin-top: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="reg-service">Service Category <span class="required-star">*</span></label>
                    <div class="input-container">
                        <i class="fa-solid fa-wrench input-icon"></i>
                        <select id="reg-service" class="form-select">
                            <option value="">-- Select Your Skill / Service --</option>
                            <option value="PLUMBING">Plumbing</option>
                            <option value="ELECTRICAL">Electrical</option>
                            <option value="HOUSEKEEPING">House Keeping</option>
                            <option value="CARPENTRY">Carpentry</option>
                            <option value="PAINTING">Painting</option>
                            <option value="APPLIANCE_REPAIR">Appliance Repair</option>
                            <option value="PEST_CONTROL">Pest Control</option>
                            <option value="GARDENING">Gardening</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-location">City / Location (Mandatory) <span class="required-star">*</span></label>
                    <div class="input-container">
                        <i class="fa-solid fa-location-dot input-icon"></i>
                        <input type="text" id="reg-location" class="form-input" placeholder="e.g. Alappuzha, Kochi, Trivandrum">
                    </div>
                    <div class="form-helper">Plain text city or region name</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-aadhar">Aadhar Number (12 Digits) <span class="required-star">*</span></label>
                    <div class="input-container">
                        <i class="fa-solid fa-fingerprint input-icon"></i>
                        <input type="text" id="reg-aadhar" class="form-input" placeholder="12-digit Aadhar number" pattern="\d{12}" maxlength="12">
                    </div>
                    <div class="form-helper">Exactly 12 numeric digits (kept confidential)</div>
                </div>
            </div>

            <button type="submit" id="btn-submit-reg" class="btn-primary" style="margin-top: 1.5rem;">
                <i class="fa-solid fa-user-plus"></i> <span>Complete Registration</span>
            </button>
        </form>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script src="js/auth.js"></script>
    <script>
        let currentRole = 'USER';

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLoginBtn = document.getElementById('tab-login-btn');
            const tabRegisterBtn = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        function selectRegisterRole(role) {
            currentRole = role;
            const cardUser = document.getElementById('card-role-user');
            const cardWorker = document.getElementById('card-role-worker');
            const workerFields = document.getElementById('worker-extra-fields');
            const regService = document.getElementById('reg-service');
            const regLocation = document.getElementById('reg-location');
            const regAadhar = document.getElementById('reg-aadhar');

            if (role === 'WORKER') {
                cardUser.classList.remove('selected');
                cardWorker.classList.add('selected');
                workerFields.style.display = 'block';
                regService.required = true;
                regLocation.required = true;
                regAadhar.required = true;
            } else {
                cardWorker.classList.remove('selected');
                cardUser.classList.add('selected');
                workerFields.style.display = 'none';
                regService.required = false;
                regLocation.required = false;
                regAadhar.required = false;
            }
        }

        async function fillAndLogin(username, password) {
            document.getElementById('login-username').value = username;
            document.getElementById('login-password').value = password;
            switchAuthTab('login');
            await doLogin(username, password);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;
            await doLogin(u, p);
        }

        async function doLogin(username, password) {
            const btn = document.getElementById('btn-submit-login');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Login failed. Please check credentials.');
                }

                Auth.saveSession(data);
                showToast(`Welcome back, ${data.name}! Redirecting to ${data.role} portal...`, 'success');
                setTimeout(() => {
                    window.location.href = `/${data.dashboard || (data.role.toLowerCase() + '.html')}`;
                }, 700);

            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Sign In to Dashboard</span>';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-reg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

            const payload = {
                role: currentRole,
                name: document.getElementById('reg-name').value.trim(),
                phone: document.getElementById('reg-phone').value.trim(),
                username: document.getElementById('reg-username').value.trim(),
                password: document.getElementById('reg-password').value
            };

            if (currentRole === 'WORKER') {
                payload.service = document.getElementById('reg-service').value;
                payload.location = document.getElementById('reg-location').value.trim();
                payload.aadhar = document.getElementById('reg-aadhar').value.trim();

                if (!payload.service) {
                    showToast('Please select a service category', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';
                    return;
                }
                if (!payload.location) {
                    showToast('Location is mandatory for workers', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';
                    return;
                }
                if (!/^\d{12}$/.test(payload.aadhar)) {
                    showToast('Aadhar must be exactly 12 numeric digits', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';
                    return;
                }
            }

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Registration failed.');
                }

                Auth.saveSession(data);
                showToast('Registration successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = `/${data.dashboard || (data.role.toLowerCase() + '.html')}`;
                }, 800);

            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';
            }
        }

        // Auto-redirect if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            if (Auth.isLoggedIn()) {
                const role = Auth.getRole();
                if (role === 'ADMIN') window.location.href = '/admin.html';
                else if (role === 'WORKER') window.location.href = '/worker.html';
                else if (role === 'USER') window.location.href = '/user.html';
            }
        });
    </script>
</body>
</html>
